<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Recipe</title>
    </head>
    <body>
        
        <h1>Upload new image</h1>
        <p>Please do not share any sensitive information nor upload images that are explicit.</p>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type ="submit">Submit</button>
        </form>

        <a href="{% url 'ledger:recipe' recipe.pk %}">Back to Recipe</a>
    </body>
</html>
